name: Build Graphics DLL

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Create project
        run: |
          mkdir -p src
          cp GraphicsMod.cs src/
          cat > GraphicsMod.csproj << 'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>net6.0</TargetFramework>
              <LangVersion>latest</LangVersion>
              <AllowUnsafeBlocks>true</AllowUnsafeBlocks>
              <OutputType>Library</OutputType>
              <AssemblyName>Graphics</AssemblyName>
            </PropertyGroup>
            <ItemGroup>
              <Reference Include="MelonLoader">
                <HintPath>libs/MelonLoader.dll</HintPath>
                <Private>false</Private>
              </Reference>
              <Reference Include="BoneLib">
                <HintPath>libs/BoneLib.dll</HintPath>
                <Private>false</Private>
              </Reference>
              <Reference Include="UnityEngine.CoreModule">
                <HintPath>libs/UnityEngine.CoreModule.dll</HintPath>
                <Private>false</Private>
              </Reference>
              <Reference Include="UnityEngine">
                <HintPath>libs/UnityEngine.dll</HintPath>
                <Private>false</Private>
              </Reference>
            </ItemGroup>
          </Project>
          EOF
          mkdir -p libs
          echo "Note: You must upload MelonLoader.dll, BoneLib.dll and UnityEngine*.dll into the libs folder for a real build."
          echo "For a quick test this workflow will still produce a placeholder."

      - name: Build
        run: |
          # This is a simplified build. For full real references you need the DLLs from your BONELAB install.
          # The important part is that the source is correct and ready.
          echo "Source is ready. Upload the required reference DLLs to libs/ for a full compile."
          # Create a dummy so the artifact exists
          echo "Graphics mod source ready" > Graphics.dll.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Graphics-Source
          path: |
            GraphicsMod.cs
            src/
            GraphicsMod.csproj
            Graphics.dll.txt
